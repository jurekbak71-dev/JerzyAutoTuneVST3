name: Build Vocal Studio 3.0 and Windows Installer
on:
  push:
    branches: [main, codex/vst3-2.0]
    paths: ['Source/**', 'tests/**', 'installer/**', 'CMakeLists.txt', 'BUILD_TRIGGER.txt', '.github/workflows/build-windows.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  checks: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DJERZY_ENABLE_LTO=ON 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build VST3 and regression tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target JerzyAutoTune_VST3 JerzyAutoTuneTests JerzyVocalDSPTests --parallel 2 2>&1 | Tee-Object compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native GUI and audio regression tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native binary and metadata
        shell: pwsh
        run: |
          $plugin = 'build/JerzyAutoTune_artefacts/Release/VST3/JERZY AUTO TUNE.vst3'
          $module = Get-Content "$plugin/Contents/Resources/moduleinfo.json" -Raw
          if ($module -notmatch '"Version":\s*"3\.0\.0"') { throw 'Wrong VST3 module version' }
          $bytes = [IO.File]::ReadAllBytes("$plugin/Contents/x86_64-win/JERZY AUTO TUNE.vst3")
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Windows PE binary missing' }
          $pe = [BitConverter]::ToInt32($bytes,60)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'Binary is not Windows x64' }
      - name: Validate VST3 with pluginval 1.0.4
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/Tracktion/pluginval/releases/tags/v1.0.4'
          $asset = $release.assets | Where-Object name -eq 'pluginval_Windows.zip' | Select-Object -First 1
          if (!$asset) { throw 'Pinned validator asset missing' }
          Invoke-WebRequest $asset.browser_download_url -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -and $asset.digest -ne "sha256:$hash") { throw 'Validator artifact checksum mismatch' }
          "pluginval 1.0.4 archive SHA256 $hash" | Tee-Object validator-download.log
          Expand-Archive pluginval.zip pluginval
          $validator = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (!$validator) { throw 'pluginval executable missing' }
          $plugin = (Resolve-Path 'build/JerzyAutoTune_artefacts/Release/VST3/JERZY AUTO TUNE.vst3').Path
          & $validator.FullName --strictness-level 5 --random-seed 71 --timeout-ms 180000 --output-dir validation --validate $plugin 2>&1 | Tee-Object pluginval.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not installed on runner' }
          $plugin = (Resolve-Path 'build/JerzyAutoTune_artefacts/Release/VST3/JERZY AUTO TUNE.vst3').Path
          & $iscc "/DPluginDir=$plugin" '/DMyAppVersion=3.0.0' installer/JerzyVocalStudio.iss 2>&1 | Tee-Object installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/*Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256.txt
      - name: Test installer and installed plugin
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*Setup.exe | Select-Object -First 1).FullName
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LOG=install-smoke.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $installed = 'C:/Program Files/Common Files/VST3/JERZY AUTO TUNE.vst3'
          if (!(Test-Path "$installed/Contents/x86_64-win/JERZY AUTO TUNE.vst3")) { throw 'Installed VST3 missing' }
          $validator = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $validator.FullName --strictness-level 5 --random-seed 71 --timeout-ms 180000 --output-dir installed-validation --validate $installed 2>&1 | Tee-Object installed-pluginval.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = 'C:/Program Files/Jerzy Audio/Vocal Studio/unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
          for ($i=0;$i -lt 10 -and (Test-Path "$installed/Contents/x86_64-win/JERZY AUTO TUNE.vst3");$i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$installed/Contents/x86_64-win/JERZY AUTO TUNE.vst3") { throw 'Uninstaller left plugin binary behind' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VocalStudio-GUI-and-validation
          path: |
            build/gui-previews/studio-*.png
            build/Testing/Temporary/LastTest.log
            validation/
            installed-validation/
            *.log
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: JerzyVocalStudio-3.0.0-Windows-x64-Installer
          path: |
            dist/*Setup.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish tested installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v3.0.0-rc1'
          $notes = @'
          Native Windows x64 VST3 installer: Vocal Studio DSP suite and Steel Studio UI.
          Automated native audio/GUI tests, pluginval strictness 5, installation, installed-plugin validation and uninstallation completed in this workflow before publication.
          Close your DAW before installation and rescan VST3 plugins. Host-visible name: JERZY AUTO TUNE. Back up projects before replacing an earlier version.
          FL Studio listening and saved-project recall require manual verification; this is a release candidate. Unsigned installer; no code-signing certificate is configured.
          '@
          $notes | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag dist/*Setup.exe dist/SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Jerzy Vocal Studio 3.0 RC1 — Windows x64 VST3' --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish diagnostic report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          $lines = @()
          foreach ($file in @('configure.log','compile.log','tests.log','pluginval.log','installer.log','installed-pluginval.log')) { if (Test-Path $file) { $lines += Get-Content $file -Tail 50 } }
          $text = $lines -join "`n"
          if ($text.Length -gt 58000) { $text = $text.Substring($text.Length-58000) }
          $body = @{name='Vocal Studio Windows validation';head_sha=$env:GITHUB_SHA;status='completed';conclusion=$env:JOB_RESULT;output=@{title='Build, tests, pluginval, installer';summary='Native Windows build and installer verification';text=$text}} | ConvertTo-Json -Depth 5
          $body | Set-Content diagnostics.json -Encoding utf8
          gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input diagnostics.json
